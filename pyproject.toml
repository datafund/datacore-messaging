[project]
name = "datacore-messaging"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "org-workspace>=0.3.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "pytest-aiohttp>=1.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
